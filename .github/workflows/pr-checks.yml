name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  Format_and_Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Oxfmt check
        run: pnpm format:check

      - name: Run Oxlint
        run: pnpm lint:oxlint --format=github

      - name: Run ESLint
        run: pnpm lint:eslint

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Check docs links
        run: pnpm lint:docs

  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell

      - name: Run tests
        run: pnpm test

