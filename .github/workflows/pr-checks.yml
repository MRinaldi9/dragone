name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  Eslint-Template-Angular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11
          runtime: "node@24"
          cache: true
          require-lockfile: true

      - name: Run ESLint
        run: pnpm lint:eslint

  Oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11
          runtime: "node@24"
          cache: true
          require-lockfile: true

      - name: Run Oxlint
        run: pnpm lint:oxlint --format=github

  Oxfmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11
          runtime: "node@24"
          cache: true
          require-lockfile: true

      - name: Run Oxfmt check
        run: pnpm format:check

  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          version: 11
          runtime: "node@24"
          cache: true
          require-lockfile: true

      - name: Install Playwright browsers
        run: pnpx playwright install --with-deps --only-shell

      - name: Run tests
        run: pnpm test
