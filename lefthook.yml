# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
assert_lefthook_installed: true
colors: true
prepare-commit-msg:
  commands:
    commitzen:
      interactive: true
      run: pnpm commit --hook # Or npx cz --hook
      env:
        LEFTHOOK: "0"
commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit {1}
pre-commit:
  parallel: true
  jobs:
    - name: Oxlint Dragone UI staged files
      run: pnpm oxlint {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
      glob: "*.{ts,html,css,js}"
    - name: ESLint Dragone
      run: pnpm eslint --fix -c projects/dragone/ui/eslint.config.mjs {staged_files}
      stage_fixed: true
      glob: "*.{ts,html,css,js}"
    - name: Format Dragone UI staged files
      run: pnpm run format {staged_files}
      stage_fixed: true
      glob: "*.{ts,html,css,js}"
